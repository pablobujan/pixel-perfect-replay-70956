name: Publicar en Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobar la URL de la hoja
        run: |
          if [ -z "$VITE_FAN_SHEET_URL" ]; then
            echo "Falta el secreto VITE_FAN_SHEET_URL"
            exit 1
          fi
        env:
          VITE_FAN_SHEET_URL: ${{ secrets.VITE_FAN_SHEET_URL }}

      - name: Compilar
        run: npm run build
        env:
          VITE_FAN_SHEET_URL: ${{ secrets.VITE_FAN_SHEET_URL }}

      - name: Publicar el Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
